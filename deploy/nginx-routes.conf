# Include inside the existing server block, alongside its original locations.
location = /campus-chatting {
    proxy_pass http://127.0.0.1:3013;
    include /etc/nginx/snippets/campus-chatting-proxy.conf;
}
location ^~ /campus-chatting/ {
    proxy_pass http://127.0.0.1:3013;
    include /etc/nginx/snippets/campus-chatting-proxy.conf;
}
