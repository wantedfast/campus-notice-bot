services:
  campus:
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    restart: unless-stopped
    env_file: .env.local
    environment:
      DATABASE_PATH: /app/data/campus.sqlite
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    volumes:
      - campus-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000'+(process.env.NEXT_PUBLIC_BASE_PATH||'')+'/api/notices').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  campus-data:
